version: '3.8'

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:16
    container_name: pg16
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123123"
      POSTGRES_DB: langgraph_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - local-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin 管理界面
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@qq.com
      PGADMIN_DEFAULT_PASSWORD: "123123"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - local-net
    depends_on:
      postgres:
        condition: service_healthy

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: redis7
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - local-net

  # LangGraph Agent Server 服务
  agent-server:
    image: langgraph-python-agent:0.1.0
    container_name: langgraph-agent
    restart: always
    env_file:
      - .env
    ports:
      - "8123:8000"
    networks:
      - local-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

# 定义网络
networks:
  local-net:
    driver: bridge

# 定义数据卷（持久化存储）
volumes:
  pg_data:
  pgadmin_data:
  redis_data:
